basePath: /api
definitions:
  clinic.Address:
    properties:
      city:
        type: string
      state:
        type: string
      street:
        type: string
      zip_code:
        type: string
    type: object
  clinic.Banking:
    properties:
      account:
        type: string
      agency:
        type: string
      bank:
        type: string
    type: object
  clinic.ClinicStatus:
    enum:
    - pending
    - active
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusActive
  clinic.CreateInput:
    properties:
      address:
        $ref: '#/definitions/clinic.Address'
      banking:
        $ref: '#/definitions/clinic.Banking'
      description:
        type: string
      document:
        type: string
      email:
        type: string
      legal_name:
        type: string
      opening_hours:
        type: string
      phone:
        type: string
      specialties:
        items:
          type: string
        type: array
      trade_name:
        type: string
      website:
        type: string
    type: object
  clinic.UpdateInput:
    properties:
      address:
        $ref: '#/definitions/clinic.Address'
      banking:
        $ref: '#/definitions/clinic.Banking'
      description:
        type: string
      document:
        type: string
      email:
        type: string
      legal_name:
        type: string
      opening_hours:
        type: string
      phone:
        type: string
      specialties:
        items:
          type: string
        type: array
      trade_name:
        type: string
      website:
        type: string
    type: object
  clinic.addressDTO:
    properties:
      city:
        type: string
      state:
        type: string
      street:
        type: string
      zip_code:
        type: string
    type: object
  clinic.bankingResponse:
    properties:
      account:
        type: string
      agency:
        type: string
      bank:
        type: string
    type: object
  clinic.clinicResponse:
    properties:
      address:
        $ref: '#/definitions/clinic.addressDTO'
      banking:
        $ref: '#/definitions/clinic.bankingResponse'
      created_at:
        type: string
      description:
        type: string
      document:
        type: string
      email:
        type: string
      id:
        type: string
      legal_name:
        type: string
      opening_hours:
        type: string
      phone:
        type: string
      specialties:
        items:
          type: string
        type: array
      status:
        $ref: '#/definitions/clinic.ClinicStatus'
      trade_name:
        type: string
      updated_at:
        type: string
      website:
        type: string
    type: object
  clinic.listResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/clinic.clinicResponse'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  dentist.CreateInput:
    properties:
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
  dentist.RolesInput:
    properties:
      is_administrator:
        type: boolean
      is_legal_representative:
        type: boolean
    type: object
  dentist.UpdateInput:
    properties:
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
  dentist.dentistResponse:
    properties:
      clinic_id:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_administrator:
        type: boolean
      is_legal_representative:
        type: boolean
      name:
        type: string
      phone:
        type: string
      updated_at:
        type: string
    type: object
  dentist.listResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dentist.dentistResponse'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  payment.CreateInput:
    properties:
      amount:
        type: integer
      clinic_id:
        type: string
      dentist_id:
        type: string
    type: object
  payment.paymentResponse:
    properties:
      amount:
        type: integer
      approved_at:
        type: string
      clinic_id:
        type: string
      created_at:
        type: string
      dentist_id:
        type: string
      id:
        type: string
      pix_code:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  problem.Details:
    properties:
      code:
        type: string
      detail:
        type: string
      errors:
        items:
          $ref: '#/definitions/problem.FieldError'
        type: array
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  problem.FieldError:
    properties:
      detail:
        type: string
      field:
        type: string
    type: object
info:
  contact: {}
  description: API de gestão de clínica odontológica — clínicas e dentistas.
  title: Clinic API
  version: "1.0"
paths:
  /clinics:
    get:
      parameters:
      - description: Page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      - description: Free-text search (trade name, legal name, specialties)
        in: query
        name: q
        type: string
      - description: Filter by city (substring, case-insensitive)
        in: query
        name: city
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clinic.listResponse'
      summary: List/search clinics (paginated)
      tags:
      - clinics
    post:
      consumes:
      - application/json
      parameters:
      - description: Clinic to create
        in: body
        name: clinic
        required: true
        schema:
          $ref: '#/definitions/clinic.CreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/clinic.clinicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Details'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Create a clinic
      tags:
      - clinics
  /clinics/{clinic_id}/dentists:
    get:
      parameters:
      - description: Clinic ID
        in: path
        name: clinic_id
        required: true
        type: string
      - description: Page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      - description: Filter by administrator flag
        in: query
        name: is_administrator
        type: boolean
      - description: Filter by legal representative flag
        in: query
        name: is_legal_representative
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dentist.listResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/problem.Details'
      summary: List dentists of a clinic (paginated)
      tags:
      - dentists
    post:
      consumes:
      - application/json
      parameters:
      - description: Clinic ID
        in: path
        name: clinic_id
        required: true
        type: string
      - description: Dentist to create
        in: body
        name: dentist
        required: true
        schema:
          $ref: '#/definitions/dentist.CreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dentist.dentistResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/problem.Details'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Create a dentist in a clinic
      tags:
      - dentists
  /clinics/{clinic_id}/dentists/{id}:
    delete:
      parameters:
      - description: Clinic ID
        in: path
        name: clinic_id
        required: true
        type: string
      - description: Dentist ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Soft-delete a dentist
      tags:
      - dentists
    get:
      parameters:
      - description: Clinic ID
        in: path
        name: clinic_id
        required: true
        type: string
      - description: Dentist ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dentist.dentistResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Get a dentist by id
      tags:
      - dentists
    put:
      consumes:
      - application/json
      parameters:
      - description: Clinic ID
        in: path
        name: clinic_id
        required: true
        type: string
      - description: Dentist ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: dentist
        required: true
        schema:
          $ref: '#/definitions/dentist.UpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dentist.dentistResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/problem.Details'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Update a dentist (partial)
      tags:
      - dentists
  /clinics/{clinic_id}/dentists/{id}/roles:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Clinic ID
        in: path
        name: clinic_id
        required: true
        type: string
      - description: Dentist ID
        in: path
        name: id
        required: true
        type: string
      - description: Flags to update (at least one required)
        in: body
        name: roles
        required: true
        schema:
          $ref: '#/definitions/dentist.RolesInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dentist.dentistResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/problem.Details'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Update a dentist's administrator/legal representative flags
      tags:
      - dentists
  /clinics/{id}:
    delete:
      parameters:
      - description: Clinic ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Soft-delete a clinic
      tags:
      - clinics
    get:
      parameters:
      - description: Clinic ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clinic.clinicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Get a clinic by id
      tags:
      - clinics
    put:
      consumes:
      - application/json
      parameters:
      - description: Clinic ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: clinic
        required: true
        schema:
          $ref: '#/definitions/clinic.UpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clinic.clinicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Update a clinic (partial)
      tags:
      - clinics
  /payments:
    post:
      consumes:
      - application/json
      parameters:
      - description: Idempotency key
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Payment to create
        in: body
        name: payment
        required: true
        schema:
          $ref: '#/definitions/payment.CreateInput'
      produces:
      - application/json
      responses:
        "200":
          description: replay of an existing payment
          schema:
            $ref: '#/definitions/payment.paymentResponse'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/payment.paymentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/problem.Details'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Create a Pix payment
      tags:
      - payments
  /payments/{id}:
    get:
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/payment.paymentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Get a payment by id
      tags:
      - payments
swagger: "2.0"
