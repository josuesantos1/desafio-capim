basePath: /api
definitions:
  clinic.Address:
    properties:
      city:
        example: São Paulo
        type: string
      state:
        example: SP
        type: string
      street:
        example: Av. Paulista, 1000
        type: string
      zip_code:
        example: 01310-100
        type: string
    type: object
  clinic.Banking:
    properties:
      account:
        type: string
      agency:
        example: "1234"
        type: string
      bank:
        example: Banco do Brasil
        type: string
    type: object
  clinic.ClinicStatus:
    enum:
    - pending
    - active
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusActive
  clinic.CreateInput:
    properties:
      address:
        $ref: '#/definitions/clinic.Address'
      banking:
        $ref: '#/definitions/clinic.Banking'
      description:
        example: Clínica odontológica completa
        type: string
      document:
        description: Document is the CPF/CNPJ. Immutable after creation.
        example: "12345678000199"
        type: string
      email:
        example: contato@clinicasorriso.com.br
        type: string
      legal_name:
        example: Clínica Sorriso LTDA
        type: string
      opening_hours:
        example: Seg a Sex, 8h às 18h
        type: string
      phone:
        example: (11) 4000-1000
        type: string
      specialties:
        example:
        - Ortodontia
        - Implantodontia
        items:
          type: string
        type: array
      trade_name:
        example: Clínica Sorriso
        type: string
      website:
        example: www.clinicasorriso.com.br
        type: string
    type: object
  clinic.UpdateInput:
    properties:
      address:
        $ref: '#/definitions/clinic.Address'
      banking:
        $ref: '#/definitions/clinic.Banking'
      description:
        example: Clínica odontológica completa
        type: string
      document:
        example: "12345678000199"
        type: string
      email:
        example: contato@clinicasorriso.com.br
        type: string
      legal_name:
        example: Clínica Sorriso LTDA
        type: string
      opening_hours:
        example: Seg a Sex, 8h às 18h
        type: string
      phone:
        example: (11) 4000-1000
        type: string
      specialties:
        items:
          type: string
        type: array
      trade_name:
        example: Clínica Sorriso
        type: string
      website:
        example: www.clinicasorriso.com.br
        type: string
    type: object
  clinic.addressDTO:
    properties:
      city:
        example: São Paulo
        type: string
      state:
        example: SP
        type: string
      street:
        example: Av. Paulista, 1000
        type: string
      zip_code:
        example: 01310-100
        type: string
    type: object
  clinic.bankingResponse:
    properties:
      account:
        example: 56789-0
        type: string
      agency:
        example: "1234"
        type: string
      bank:
        example: Banco do Brasil
        type: string
    type: object
  clinic.clinicResponse:
    properties:
      address:
        $ref: '#/definitions/clinic.addressDTO'
      banking:
        $ref: '#/definitions/clinic.bankingResponse'
      created_at:
        type: string
      description:
        example: Clínica odontológica completa
        type: string
      document:
        example: "12345678000199"
        type: string
      email:
        example: contato@clinicasorriso.com.br
        type: string
      id:
        example: a0000000-0000-0000-0000-000000000001
        type: string
      legal_name:
        example: Clínica Sorriso LTDA
        type: string
      opening_hours:
        example: Seg a Sex, 8h às 18h
        type: string
      phone:
        example: (11) 4000-1000
        type: string
      specialties:
        items:
          type: string
        type: array
      status:
        allOf:
        - $ref: '#/definitions/clinic.ClinicStatus'
        enum:
        - pending
        - active
        example: active
      trade_name:
        example: Clínica Sorriso
        type: string
      updated_at:
        type: string
      website:
        example: www.clinicasorriso.com.br
        type: string
    type: object
  clinic.listResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/clinic.clinicResponse'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  dentist.CreateInput:
    properties:
      bio:
        example: Especialista em ortodontia
        type: string
      email:
        example: ana.souza@clinicasorriso.com.br
        type: string
      name:
        example: Dra. Ana Souza
        type: string
      phone:
        example: (11) 98888-0001
        type: string
      specialties:
        example:
        - Ortodontia
        - Invisalign
        items:
          type: string
        type: array
      years_of_experience:
        example: 12
        type: integer
    type: object
  dentist.RolesInput:
    properties:
      is_administrator:
        example: true
        type: boolean
      is_legal_representative:
        example: true
        type: boolean
    type: object
  dentist.UpdateInput:
    properties:
      bio:
        example: Especialista em ortodontia
        type: string
      email:
        example: ana.souza@clinicasorriso.com.br
        type: string
      name:
        example: Dra. Ana Souza
        type: string
      phone:
        example: (11) 98888-0001
        type: string
      specialties:
        items:
          type: string
        type: array
      years_of_experience:
        example: 12
        type: integer
    type: object
  dentist.dentistResponse:
    properties:
      bio:
        example: Especialista em ortodontia
        type: string
      clinic_id:
        example: a0000000-0000-0000-0000-000000000001
        type: string
      created_at:
        type: string
      email:
        example: ana.souza@clinicasorriso.com.br
        type: string
      id:
        example: a0000000-0000-0000-0000-000000000011
        type: string
      is_administrator:
        example: true
        type: boolean
      is_legal_representative:
        example: true
        type: boolean
      name:
        example: Dra. Ana Souza
        type: string
      phone:
        example: (11) 98888-0001
        type: string
      specialties:
        items:
          type: string
        type: array
      updated_at:
        type: string
      years_of_experience:
        example: 12
        type: integer
    type: object
  dentist.listResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dentist.dentistResponse'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  payment.CreateInput:
    properties:
      amount:
        description: Amount is in cents (e.g. 15000 = R$ 150,00). Must be greater
          than zero.
        example: 15000
        type: integer
      clinic_id:
        example: a0000000-0000-0000-0000-000000000001
        type: string
      dentist_id:
        type: string
    type: object
  payment.listResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/payment.paymentResponse'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  payment.paymentResponse:
    properties:
      amount:
        example: 15000
        type: integer
      approved_at:
        type: string
      clinic_id:
        example: a0000000-0000-0000-0000-000000000001
        type: string
      created_at:
        type: string
      dentist_id:
        type: string
      id:
        example: 62818880-fffa-4512-bb48-34692f49e3cb
        type: string
      pix_code:
        example: 000201262yZEd13q_BCi_wyx1gxaDLUbQfdU7oY5dm7GMumLL_A
        type: string
      status:
        enum:
        - pending
        - approved
        example: pending
        type: string
      updated_at:
        type: string
    type: object
  problem.Details:
    properties:
      code:
        example: VALIDATION_ERROR
        type: string
      detail:
        example: request validation failed
        type: string
      errors:
        items:
          $ref: '#/definitions/problem.FieldError'
        type: array
      status:
        example: 400
        type: integer
      title:
        example: Bad Request
        type: string
      type:
        example: about:blank
        type: string
    type: object
  problem.FieldError:
    properties:
      detail:
        example: is required
        type: string
      field:
        example: clinic_id
        type: string
    type: object
info:
  contact: {}
  description: |-
    API de gestão de clínica odontológica: clínicas, dentistas e pagamentos via Pix (simulado).
    Todos os endpoints de negócio ficam sob o prefixo /api; o único fora dele é o health check em /health.
    Erros seguem o formato RFC 9457 (application/problem+json) em todo o corpo, com um campo "code" estável para tratamento programático além do "status" HTTP.
  title: Clinic API
  version: "1.0"
paths:
  /clinics:
    get:
      parameters:
      - default: 20
        description: Page size
        in: query
        maximum: 100
        name: limit
        type: integer
      - default: 0
        description: Offset for pagination
        in: query
        name: offset
        type: integer
      - description: Free-text search (trade name, legal name, specialties)
        in: query
        name: q
        type: string
      - description: Filter by city (substring, case-insensitive)
        in: query
        name: city
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clinic.listResponse'
      summary: List/search clinics (paginated)
      tags:
      - clinics
    post:
      consumes:
      - application/json
      description: Creates a clinic with status "pending". It becomes "active" automatically
        once it has at least one dentist marked as administrator and one marked as
        legal representative.
      parameters:
      - description: Clinic to create
        in: body
        name: clinic
        required: true
        schema:
          $ref: '#/definitions/clinic.CreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/clinic.clinicResponse'
        "400":
          description: validation error
          schema:
            $ref: '#/definitions/problem.Details'
        "409":
          description: document already belongs to another clinic
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Create a clinic
      tags:
      - clinics
  /clinics/{clinic_id}/dentists:
    get:
      parameters:
      - description: Clinic ID
        format: uuid
        in: path
        name: clinic_id
        required: true
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 100
        name: limit
        type: integer
      - default: 0
        description: Offset for pagination
        in: query
        name: offset
        type: integer
      - description: Filter by administrator flag
        in: query
        name: is_administrator
        type: boolean
      - description: Filter by legal representative flag
        in: query
        name: is_legal_representative
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dentist.listResponse'
        "400":
          description: clinic_id is not a valid UUID
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: clinic not found
          schema:
            $ref: '#/definitions/problem.Details'
      summary: List dentists of a clinic (paginated)
      tags:
      - dentists
    post:
      consumes:
      - application/json
      description: Creates a dentist attached to the given clinic. Set is_administrator/is_legal_representative
        afterwards via the roles endpoint if needed.
      parameters:
      - description: Clinic ID
        format: uuid
        in: path
        name: clinic_id
        required: true
        type: string
      - description: Dentist to create
        in: body
        name: dentist
        required: true
        schema:
          $ref: '#/definitions/dentist.CreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dentist.dentistResponse'
        "400":
          description: validation error
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: clinic not found
          schema:
            $ref: '#/definitions/problem.Details'
        "409":
          description: email already belongs to another dentist in this clinic
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Create a dentist in a clinic
      tags:
      - dentists
  /clinics/{clinic_id}/dentists/{id}:
    delete:
      description: Rejected with 409 if the dentist is the clinic's last administrator
        or last legal representative.
      parameters:
      - description: Clinic ID
        format: uuid
        in: path
        name: clinic_id
        required: true
        type: string
      - description: Dentist ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: dentist deleted
        "400":
          description: id is not a valid UUID
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: clinic or dentist not found
          schema:
            $ref: '#/definitions/problem.Details'
        "409":
          description: would leave the clinic without an administrator or legal representative
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Soft-delete a dentist
      tags:
      - dentists
    get:
      parameters:
      - description: Clinic ID
        format: uuid
        in: path
        name: clinic_id
        required: true
        type: string
      - description: Dentist ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dentist.dentistResponse'
        "400":
          description: id is not a valid UUID
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: clinic or dentist not found
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Get a dentist by id
      tags:
      - dentists
    put:
      consumes:
      - application/json
      description: Only non-null fields in the body are applied. Does not change is_administrator/is_legal_representative
        — use PATCH .../roles for that.
      parameters:
      - description: Clinic ID
        format: uuid
        in: path
        name: clinic_id
        required: true
        type: string
      - description: Dentist ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: dentist
        required: true
        schema:
          $ref: '#/definitions/dentist.UpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dentist.dentistResponse'
        "400":
          description: validation error
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: clinic or dentist not found
          schema:
            $ref: '#/definitions/problem.Details'
        "409":
          description: email already belongs to another dentist in this clinic
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Update a dentist (partial)
      tags:
      - dentists
  /clinics/{clinic_id}/dentists/{id}/roles:
    patch:
      consumes:
      - application/json
      description: An active clinic must always keep at least one administrator and
        one legal representative; demoting the last one of either role returns 409.
      parameters:
      - description: Clinic ID
        format: uuid
        in: path
        name: clinic_id
        required: true
        type: string
      - description: Dentist ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Flags to update (at least one required)
        in: body
        name: roles
        required: true
        schema:
          $ref: '#/definitions/dentist.RolesInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dentist.dentistResponse'
        "400":
          description: validation error
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: clinic or dentist not found
          schema:
            $ref: '#/definitions/problem.Details'
        "409":
          description: would leave the clinic without an administrator or legal representative
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Update a dentist's administrator/legal representative flags
      tags:
      - dentists
  /clinics/{id}:
    delete:
      description: Marks the clinic as deleted (DeletedAt is set); it stops appearing
        in list/get and its document becomes reusable for a new clinic. Existing dentists
        and payments are not affected.
      parameters:
      - description: Clinic ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: clinic deleted
        "400":
          description: id is not a valid UUID
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: clinic not found
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Soft-delete a clinic
      tags:
      - clinics
    get:
      parameters:
      - description: Clinic ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clinic.clinicResponse'
        "400":
          description: id is not a valid UUID
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: clinic not found
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Get a clinic by id
      tags:
      - clinics
    put:
      consumes:
      - application/json
      description: Only non-null fields in the body are applied. "document" cannot
        be changed after creation and returns 400 DOCUMENT_IMMUTABLE if attempted.
      parameters:
      - description: Clinic ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: clinic
        required: true
        schema:
          $ref: '#/definitions/clinic.UpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clinic.clinicResponse'
        "400":
          description: validation error or attempt to change document
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: clinic not found
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Update a clinic (partial)
      tags:
      - clinics
  /payments:
    get:
      parameters:
      - description: Clinic ID
        format: uuid
        in: query
        name: clinic_id
        required: true
        type: string
      - description: Filter by status
        enum:
        - pending
        - approved
        in: query
        name: status
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 100
        name: limit
        type: integer
      - default: 0
        description: Offset for pagination
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/payment.listResponse'
        "400":
          description: clinic_id missing or not a valid UUID
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: clinic not found
          schema:
            $ref: '#/definitions/problem.Details'
      summary: List payments for a clinic (paginated)
      tags:
      - payments
    post:
      consumes:
      - application/json
      description: Creates a "pending" payment with a simulated Pix copy-and-paste
        code. A background job approves it automatically after a random 2-5s delay.
        Replaying the same Idempotency-Key with the same body returns the original
        payment (200); replaying it with a different body returns 409.
      parameters:
      - description: Client-generated unique key; safe to retry a request with the
          same key
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Payment to create
        in: body
        name: payment
        required: true
        schema:
          $ref: '#/definitions/payment.CreateInput'
      produces:
      - application/json
      responses:
        "200":
          description: replay of an existing payment (same Idempotency-Key and body)
          schema:
            $ref: '#/definitions/payment.paymentResponse'
        "201":
          description: payment created
          schema:
            $ref: '#/definitions/payment.paymentResponse'
        "400":
          description: missing Idempotency-Key header or validation error
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: clinic or dentist not found
          schema:
            $ref: '#/definitions/problem.Details'
        "409":
          description: clinic not active, or Idempotency-Key reused with a different
            body
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Create a Pix payment
      tags:
      - payments
  /payments/{id}:
    get:
      description: Poll this endpoint to observe the status transition from "pending"
        to "approved".
      parameters:
      - description: Payment ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/payment.paymentResponse'
        "400":
          description: id is not a valid UUID
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: payment not found
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Get a payment by id
      tags:
      - payments
schemes:
- http
swagger: "2.0"
